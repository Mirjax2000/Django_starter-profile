{% extends "base.html" %}
{% block title %}
    User list
{% endblock title %}

{% block content %}
    <h1>User list</h1>
    <ul>
        {% for user in users %}
            <li><a href="{% url 'user_profile' user.id %}">{{ user }}</a></li>
        {% empty %} No users
        {% endfor %}
    </ul>
{% endblock content %}
